<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calc Produção</title>

    <link rel="stylesheet" href="estilo.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <div class="app">

        <h1>Calc Produção</h1>
        <p class="subtitulo">Glaciamento • Acréscimo Percentual</p>

        <!-- Botões de seleção -->
        <div class="botoes-modo">

            <button id="btnGlaciamento"
                    class="modo ativo"
                    onclick="mostrarGlaciamento()">
                Glaciamento
            </button>

            <button id="btnAcrescimo"
                    class="modo"
                    onclick="mostrarAcrescimo()">
                Acréscimo %
            </button>

        </div>

        <!-- ===================== -->
        <!-- TELA GLACIAMENTO -->
        <!-- ===================== -->

        <div id="glaciamento">

            <label for="inicial">Peso Inicial (kg)</label>
            <input
                id="inicial"
                type="number"
                step="0.001"
                placeholder="Ex.: 10.000">

            <label for="final">Peso Final (kg)</label>
            <input
                id="final"
                type="number"
                step="0.001"
                placeholder="Ex.: 11.250">

        </div>

        <!-- ===================== -->
        <!-- TELA ACRÉSCIMO -->
        <!-- ===================== -->

        <div id="acrescimo" style="display:none;">

            <label for="quantidade">Quantidade</label>
            <input
                id="quantidade"
                type="number"
                step="0.001"
                placeholder="Ex.: 10.000">

            <label for="percentual">Porcentagem (%)</label>
            <input
                id="percentual"
                type="number"
                step="0.01"
                placeholder="Ex.: 12">

        </div>

        <!-- Botão -->

        <button class="calcular" onclick="calcular()">
            CALCULAR
        </button>

        <!-- Resultado -->

        <div id="resultado" class="resultado">

            Aguardando cálculo...

        </div>

        <footer>

            Versão 2.0<br>
            © 2026 Robson Bohora / Crissiane

        </footer>

    </div>

    <script>

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js");
        }

    </script>

    <script src="calculo.js"></script>

</body>

</html>
